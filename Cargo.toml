[workspace]
members = [
    "crates/tools-common",
    "crates/tools-cli",
    "crates/tools-gui",
    "crates/hm-fastboot",
    "crates/hisi-vcom",
    "crates/erofs",
    "crates/ext4-extract",
    "crates/online-fetcher"
]
default-members = [
    "crates/tools-cli",
    "crates/tools-gui",
]
resolver = "3"

#[profile.release]
#lto = true

# Keep multi-gigabyte ZIP inspection responsive in development builds.
[profile.dev.package.zlib-rs]
opt-level = 3
# Its C-ABI total_in counter wraps at 4 GiB on Windows; the Rust API keeps u64 totals.
overflow-checks = false

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
bzip2 = { version = "0.5", default-features = false, features = ["libbz2-rs-sys"] }
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
clap = { version = "4.5", features = ["derive"] }
crc32c = "0.6"
ext4-metadata = { package = "ext4", version = "0.9.0" }
ext4-view = { version = "0.9.3", features = ["std"] }
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.34"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
fs2 = "0.4"
hex = "0.4"
libc = "0.2"
lz4 = "1.28"
lz4-sys = "1.11"
lzma-rust2 = { version = "0.1", features = ["encoder"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4.9", default-features = false }
sha2 = "0.10"
shlex = "1.3"
zip = { version = "4", default-features = false, features = ["deflate-flate2", "deflate-zopfli"] }
x509-parser = "0.18"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
zstd = "0.13"
