[package]
name = "gui"
version.workspace = true
edition.workspace = true
description = "egui desktop interface for haucet"
license.workspace = true

[[bin]]
name = "haucet-gui"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
common = { path = "../tools-common" }
eframe.workspace = true
egui.workspace = true
egui_extras = { version = "0.34", default-features = false, features = ["image"] }
fluent-bundle = "0.16"
flate2.workspace = true
hisi-vcom = { path = "../hisi-vcom" }
hm-fastboot = { path = "../hm-fastboot" }
image = { version = "0.25", default-features = false, features = ["bmp", "png"] }
online-fetcher = { path = "../online-fetcher" }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread"] }
unic-langid = { version = "0.9", features = ["macros"] }

[build-dependencies]
winresource = { version = "0.1", default-features = false }

# The X11 backend only exists on Unix; on Windows eframe uses its native
# (WGL/OpenGL via glow) backend.
[target.'cfg(unix)'.dependencies]
eframe = { workspace = true, features = ["x11"] }
libc.workspace = true

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
window-vibrancy = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
