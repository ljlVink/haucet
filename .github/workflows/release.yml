name: release

# Build and package the Windows x64 deliverables when a new tag is pushed,
# or manually from the Actions tab.
on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Tag name for the package and draft release. Empty = use the current
          ref name; running from a branch without a value only uploads the
          artifact and skips the release.
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: "0"

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --locked --target x86_64-pc-windows-msvc -p cli -p gui

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          # Sanitize characters that are invalid in artifact and file names.
          $name = ($tag -replace '[\\/:*?"<>|]', '-') + "-windows-x64"
          $staging = "haucet-$name"
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/haucet.exe $staging
          Copy-Item target/x86_64-pc-windows-msvc/release/haucet-gui.exe $staging
          Compress-Archive -Path $staging -DestinationPath "$staging.zip"
          "asset=$staging.zip" | Out-File -FilePath $env:GITHUB_ENV -Append
          "pkgname=$name" | Out-File -FilePath $env:GITHUB_ENV -Append
          "release_tag=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.pkgname }}
          path: ${{ env.asset }}
          if-no-files-found: error

      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ env.release_tag }}
          files: ${{ env.asset }}
