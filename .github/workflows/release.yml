name: release
on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Tag name for the packages and draft release. Empty = use the current
          ref name; running from a branch without a value only uploads the
          artifacts and skips the release.
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: Build ${{ matrix.slug }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: windows-x64
            runs-on: windows-latest
            target: x86_64-pc-windows-msvc
          - slug: linux-x64
            runs-on: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - slug: linux-arm64
            runs-on: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --release --locked --target ${{ matrix.target }} -p cli -p gui

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          # Sanitize characters that are invalid in artifact and file names.
          $name = ($tag -replace '[\\/:*?"<>|]', '-') + "-${{ matrix.slug }}"
          $staging = "haucet-$name"
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/haucet.exe" $staging
          Copy-Item "target/${{ matrix.target }}/release/haucet-gui.exe" $staging
          Compress-Archive -Path $staging -DestinationPath "$staging.zip"
          "asset=$staging.zip" | Out-File -FilePath $env:GITHUB_ENV -Append
          "pkgname=$name" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          # Sanitize characters that are invalid in artifact and file names.
          name="$(printf '%s' "$tag" | tr '\\/:*?"<>|' '-')-${{ matrix.slug }}"
          staging="haucet-$name"
          mkdir "$staging"
          cp "target/${{ matrix.target }}/release/haucet" "$staging/"
          cp "target/${{ matrix.target }}/release/haucet-gui" "$staging/"
          zip -r "$staging.zip" "$staging"
          echo "asset=$staging.zip" >> "$GITHUB_ENV"
          echo "pkgname=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.pkgname }}
          path: ${{ env.asset }}
          if-no-files-found: error

  draft-release:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/**/*.zip
